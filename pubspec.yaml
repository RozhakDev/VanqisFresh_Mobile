name: vanqisfresh
description: VanqisFresh mobile application for product catalog and order management (Flutter client).

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1
  flutter_riverpod: ^3.3.1
  dio: ^5.9.2
  go_router: ^17.2.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0

  image_picker: ^1.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env